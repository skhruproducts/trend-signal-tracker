[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trend-signal-tracker"
version = "0.1.0"
description = "Deterministic, testable rules for turning market signals into themes and trends."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Solomiya Khrushch" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"trend_tracker.notion" = ["schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
